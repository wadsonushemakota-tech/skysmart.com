# Keeps the free Render server awake during business hours and the Supabase database active.
#
# Schedule: every 10 minutes from 06:00 to 21:50 Zimbabwe time (04:00-19:50 UTC). That is about
# 500 server-hours a month, leaving room in Render's 750 free hours for the account's other service.
# Overnight the server may sleep; the first visitor then waits up to a minute.
#
# GitHub may start scheduled runs a few minutes late, and pauses schedules in repositories with no
# commits for 60 days (it emails the owner; re-enable under the repository's Actions tab).

name: Keep server awake

on:
  schedule:
    - cron: '*/10 4-19 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and database
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://sky-smart-api.onrender.com/api/keepalive
