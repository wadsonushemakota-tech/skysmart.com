<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1600" width="1500" height="1600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="paperG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f3eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ece4d2;stop-opacity:1"/>
    </linearGradient>
    <filter id="paperT" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feComposite in="SourceGraphic" in2="gn" operator="arithmetic" k1="0.55" k2="0.45" k3="0" k4="0"/>
    </filter>
  </defs>

  <!-- Paper background matching the exact reference -->
  <rect width="1500" height="1600" fill="url(#paperG)"/>

  <g fill="#0d2c63">
    <!-- ========== TOP-RIGHT: "36" + tiny SS monogram ========== -->
    <g transform="translate(1320, 80)">
      <text x="0" y="0"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="62" font-weight="700">36</text>
      <!-- tiny SS monogram next to 36 -->
      <g transform="translate(75, -30) scale(0.62)">
        <path d="M -30,-25
                 C -30,-45 -15,-52 0,-52
                 C 15,-52 30,-45 30,-25
                 C 30,-12 18,-6 0,-6
                 C -18,-6 -30,-12 -30,0
                 C -30,20 -18,30 0,30
                 C 18,30 30,20 30,0
                 C 30,-12 24,-20 15,-22
                 C 24,-26 30,-32 30,-40
                 C 30,-52 18,-58 0,-58
                 C -18,-58 -30,-52 -30,-40
                 C -30,-26 -24,-22 -15,-22
                 C -24,-18 -30,-10 -30,0 Z"/>
      </g>
    </g>

    <!-- ========== ARCHED SKY SMART (wide and tall arc) ========== -->
    <!-- Wide, tall arc path — spans nearly full width -->
    <path id="arc2" fill="none" d="M 70,520 Q 750,50 1430,520"/>
    <text font-family="Georgia, 'Times New Roman', serif"
          font-size="210"
          font-weight="900"
          letter-spacing="18">
      <textPath href="#arc2" startOffset="50%" text-anchor="middle">SKY SMART</textPath>
    </text>

    <!-- ========== HUGE CENTERED SS MONOGRAM — single biggest element ========== -->
    <g transform="translate(750,900) scale(5.2)">
      <path d="M -90,-80
               C -90,-130 -50,-150 0,-150
               C 50,-150 90,-130 90,-80
               C 90,-40 50,-20 0,-20
               C -50,-20 -90,-40 -90,0
               C -90,50 -50,80 0,80
               C 50,80 90,50 90,0
               C 90,-30 70,-45 45,-55
               C 70,-65 90,-85 90,-110
               C 90,-145 50,-170 0,-170
               C -50,-170 -90,-145 -90,-110
               C -90,-80 -60,-65 -35,-55
               C -60,-45 -90,-30 -90,0 Z
               M -35,45
               C -55,35 -65,20 -65,0
               C -65,-25 -40,-40 -15,-45
               C 10,-50 40,-40 50,-20
               C 55,-10 50,5 35,10
               C 20,15 0,20 -20,35
               C -30,45 -35,45 -35,45 Z
               M 35,55
               C 55,45 65,25 65,0
               C 65,-25 40,-40 15,-45
               C -10,-50 -40,-40 -50,-20
               C -55,-10 -50,5 -35,10
               C -20,15 0,20 20,35
               C 30,45 35,55 35,55 Z
               M 0,-70
               L -25,-90
               L 25,-90
               Z"/>
    </g>

    <!-- ========== VERSE: Philippians 4:13 + 3 lines italic ========== -->
    <text x="750" y="1320" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="92" font-style="italic" font-weight="600"
          fill="#1a3d7c">Philippians 4:13</text>
    <text x="750" y="1435" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72" font-style="italic"
          fill="#1a3d7c">I can do all things through Christ</text>
    <text x="750" y="1535" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72" font-style="italic"
          fill="#1a3d7c">who strengthens me</text>
  </g>
</svg>
