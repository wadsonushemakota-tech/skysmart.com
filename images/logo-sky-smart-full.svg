<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1600" width="1500" height="1600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f1e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede7d9;stop-opacity:1" />
    </linearGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f1e8" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="0.8" k2="0.2" k3="0" k4="0"/>
    </filter>
  </defs>
  <rect width="1500" height="1600" fill="url(#bgGrad)"/>
  
  <g fill="#0d2c63">
    <path id="arcPath" fill="none" d="M 150,600 Q 750,100 1350,600"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="900" letter-spacing="18">
      <textPath href="#arcPath" startOffset="50%" text-anchor="middle">SKY SMART</textPath>
    </text>

    <g transform="translate(750,830) scale(2.2)">
      <path d="M -90,-80 
               C -90,-130 -50,-150 0,-150 
               C 50,-150 90,-130 90,-80 
               C 90,-40 50,-20 0,-20 
               C -50,-20 -90,-40 -90,0 
               C -90,50 -50,80 0,80 
               C 50,80 90,50 90,0 
               C 90,-30 70,-45 45,-55 
               C 70,-65 90,-85 90,-110 
               C 90,-145 50,-170 0,-170 
               C -50,-170 -90,-145 -90,-110 
               C -90,-80 -60,-65 -35,-55 
               C -60,-45 -90,-30 -90,0 Z
               M -35,45 
               C -55,35 -65,20 -65,0 
               C -65,-25 -40,-40 -15,-45 
               C 10,-50 40,-40 50,-20 
               C 55,-10 50,5 35,10 
               C 20,15 0,20 -20,35 
               C -30,45 -35,45 -35,45 Z
               M 35,55 
               C 55,45 65,25 65,0 
               C 65,-25 40,-40 15,-45 
               C -10,-50 -40,-40 -50,-20 
               C -55,-10 -50,5 -35,10 
               C -20,15 0,20 20,35 
               C 30,45 35,55 35,55 Z
               M 0,-70 
               L -25,-90 
               L 25,-90 
               Z"/>
    </g>

    <text x="750" y="1280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-style="italic" font-weight="600" fill="#1a3d7c">Philippians 4:13</text>
    <text x="750" y="1390" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" fill="#1a3d7c">I can do all things through Christ</text>
    <text x="750" y="1475" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" fill="#1a3d7c">who strengthens me</text>
  </g>
</svg>
