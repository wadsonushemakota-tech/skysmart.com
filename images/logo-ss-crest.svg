<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe08a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#f5d061;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a84b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5d061;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldEdge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2b3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a84b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueShield2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3d7c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2c63;stop-opacity:1" />
    </linearGradient>
    <filter id="goldShine2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="1.5" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <feDistantLight azimuth="45" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceGraphic" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1300" fill="#ffffff"/>

  <!-- LEFT SUN RAYS -->
  <g fill="url(#goldGrad2)" filter="url(#goldShine2)">
    <path d="M 140,300 L 260,265 L 255,345 Z"/>
    <path d="M 125,415 L 245,380 L 240,458 Z"/>
    <path d="M 125,530 L 245,495 L 240,573 Z"/>
    <path d="M 140,645 L 260,610 L 255,690 Z"/>
    <path d="M 170,755 L 285,720 L 280,795 Z"/>
    <path d="M 215,855 L 320,822 L 315,893 Z"/>
    <path d="M 270,945 L 365,912 L 360,978 Z"/>
  </g>

  <!-- RIGHT SUN RAYS -->
  <g fill="url(#goldGrad2)" filter="url(#goldShine2)">
    <path d="M 860,300 L 740,265 L 745,345 Z"/>
    <path d="M 875,415 L 755,380 L 760,458 Z"/>
    <path d="M 875,530 L 755,495 L 760,573 Z"/>
    <path d="M 860,645 L 740,610 L 745,690 Z"/>
    <path d="M 830,755 L 715,720 L 720,795 Z"/>
    <path d="M 785,855 L 680,822 L 685,893 Z"/>
    <path d="M 730,945 L 635,912 L 640,978 Z"/>
  </g>

  <!-- SHIELD OUTER GOLD BORDER (fills upper 80% of canvas) -->
  <g filter="url(#goldShine2)">
    <path d="M 280,70 
             L 280,45 L 300,45 L 300,15 
             L 360,15 L 360,45 L 500,45 L 500,0 L 500,0 L 500,45 L 640,45 L 640,15 L 700,15 L 700,45 L 720,45 L 720,70 
             L 720,520 
             Q 720,740 575,895 
             L 500,975
             L 425,895
             Q 280,740 280,520 Z" 
          fill="url(#goldEdge2)" stroke="#8b6914" stroke-width="2.5"/>
  </g>

  <!-- SHIELD INNER BLUE -->
  <path d="M 315,80 
           L 685,80 
           L 685,520 
           Q 685,725 560,865 
           L 500,930
           L 440,865
           Q 315,725 315,520 Z" 
        fill="url(#blueShield2)" stroke="#0a1f4e" stroke-width="1.5"/>

  <!-- THIN GOLD INNER FRAME -->
  <path d="M 345,110 L 655,110 L 655,175 M 345,110 L 345,175" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- GOLD V CHEVRON AT BOTTOM -->
  <path d="M 345,660 L 500,860 L 655,660" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldShine2)"/>

  <!-- SS MONOGRAM - LARGE, centered in shield -->
  <g transform="translate(500,460) scale(3.1)" fill="url(#goldGrad2)" filter="url(#goldShine2)">
    <path d="M -90,-80 
             C -90,-130 -50,-150 0,-150 
             C 50,-150 90,-130 90,-80 
             C 90,-40 50,-20 0,-20 
             C -50,-20 -90,-40 -90,0 
             C -90,50 -50,80 0,80 
             C 50,80 90,50 90,0 
             C 90,-30 70,-45 45,-55 
             C 70,-65 90,-85 90,-110 
             C 90,-145 50,-170 0,-170 
             C -50,-170 -90,-145 -90,-110 
             C -90,-80 -60,-65 -35,-55 
             C -60,-45 -90,-30 -90,0 Z
             M -35,45 
             C -55,35 -65,20 -65,0 
             C -65,-25 -40,-40 -15,-45 
             C 10,-50 40,-40 50,-20 
             C 55,-10 50,5 35,10 
             C 20,15 0,20 -20,35 
             C -30,45 -35,45 -35,45 Z
             M 35,55 
             C 55,45 65,25 65,0 
             C 65,-25 40,-40 15,-45 
             C -10,-50 -40,-40 -50,-20 
             C -55,-10 -50,5 -35,10 
             C -20,15 0,20 20,35 
             C 30,45 35,55 35,55 Z
             M 0,-70 
             L -25,-90 
             L 25,-90 
             Z"/>
  </g>

  <!-- SKY SMART TEXT - LARGE, fills bottom ~25% of canvas -->
  <text x="500" y="1170" text-anchor="middle" 
        font-family="'Georgia', 'Times New Roman', serif" 
        font-size="145" 
        font-weight="900" 
        letter-spacing="18"
        fill="url(#goldGrad2)"
        filter="url(#goldShine2)">SKY SMART</text>

  <text x="500" y="1265" text-anchor="middle" 
        font-family="'Georgia', 'Times New Roman', serif" 
        font-size="40" 
        font-style="italic"
        letter-spacing="6"
        fill="url(#goldGrad2)"
        opacity="0.85">Clothing &amp; Apparel</text>
</svg>
